<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14231b">
  <meta name="description" content="実物の花札で遊ぶときの点数計算。取った札をタップすると役と点数を出し、局ごとの記録と合計を残します。">
  <title>花札 点数計算</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='14' y='4' width='36' height='56' rx='5' fill='%23f4ecd8' stroke='%231d1a17' stroke-width='3'/%3E%3Ccircle cx='32' cy='24' r='10' fill='%23c8242c'/%3E%3Crect x='14' y='40' width='36' height='20' fill='%231d1a17'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/score.css">
</head>
<body>
  <header class="bar">
    <a class="back" href="./" aria-label="こいこいへ戻る">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <h1>点数計算</h1>
    <span class="mode-label" id="modeLabel"></span>
    <button class="icon-btn" id="btnSetup" aria-label="設定">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
  </header>

  <main id="board" hidden>
    <section class="totals" id="totals"></section>
    <p class="progress" id="progress"></p>
    <table class="records" id="records"></table>
    <p class="empty" id="empty">局が終わったら下のボタンから記録します。記録した局はタップで直せます。</p>
  </main>

  <div class="dock" id="dock" hidden>
    <button class="primary" id="btnAdd"></button>
  </div>

  <!-- 設定 -->
  <section class="sheet" id="setup" hidden>
    <div class="sheet-body">
      <h2 id="setupTitle">対局の設定</h2>
      <div class="field">
        <div class="label">遊び方</div>
        <div class="seg" id="setMode">
          <button data-v="koikoi">こいこい</button><button data-v="hanaawase">花合わせ</button>
        </div>
      </div>
      <div class="field" id="fieldCount">
        <div class="label">人数</div>
        <div class="seg" id="setCount"><button data-v="2">2人</button><button data-v="3">3人</button></div>
      </div>
      <div class="field">
        <div class="label">名前</div>
        <div class="names" id="setNames"></div>
      </div>
      <div class="field">
        <div class="label">局数</div>
        <div class="stepper">
          <button data-d="-1" aria-label="減らす">−</button><b id="setRounds"></b><button data-d="1" aria-label="増やす">＋</button>
          <span class="seg quick"><button data-r="6">6局</button><button data-r="12">12局</button></span>
        </div>
      </div>
      <div class="field" id="fieldRules">
        <div class="label">ルール（こいこい）</div>
        <label class="toggle"><input type="checkbox" data-rule="sevenDouble"><span>7点以上は2倍</span></label>
        <label class="toggle"><input type="checkbox" data-rule="koikoiDouble"><span>相手のこいこい中に上がると2倍</span></label>
        <label class="toggle"><input type="checkbox" data-rule="sakeYaku"><span>花見で一杯・月見で一杯あり</span></label>
        <label class="toggle"><input type="checkbox" data-rule="sakeAsPlain"><span>菊に盃をカスにも数える</span></label>
      </div>
      <p class="note" id="setupNote"></p>
    </div>
    <div class="sheet-foot">
      <button class="secondary" id="btnSetupCancel">閉じる</button>
      <button class="primary" id="btnSetupOk">はじめる</button>
    </div>
    <div class="sheet-extra" id="setupExtra">
      <button class="danger-link" id="btnReset">記録を消して新しい対局にする</button>
    </div>
  </section>

  <!-- 局の入力 -->
  <section class="sheet" id="editor" hidden>
    <div class="sheet-body">
      <div class="ed-head">
        <h2 id="edTitle"></h2>
        <button class="danger-link" id="btnDelete" hidden>この局を消す</button>
      </div>
      <div id="edBody"></div>
    </div>
    <div class="result" id="edResult"></div>
    <div class="sheet-foot">
      <button class="secondary" id="btnEdCancel">やめる</button>
      <button class="primary" id="btnEdSave">記録する</button>
    </div>
  </section>

  <div id="toast" role="status"></div>
  <script type="module" src="js/score.js"></script>
</body>
</html>
