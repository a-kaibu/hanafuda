name: Commons card art discovery
on:
  push:
    branches: [main]
    paths: [tools/commons_discover.py, .github/workflows/commons-discover.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/commons_discover.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cards/_discovery.json
          git commit -m "Commons の花札画像候補とライセンス情報を取得" || exit 0
          git push
